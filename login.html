
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login-style.css">
    <title>Trang Đăng Nhập</title>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Đăng Nhập</h1>
        </div>
        <div class="form-group">
            <p class="input-label">Email hoặc số điện thoại</p>
            <p class="input-box" contenteditable="true" placeholder="Nhập email hoặc số điện thoại"></p>
        </div>
        <div class="form-group">
            <p class="input-label">Mật khẩu</p>
            <p class="input-box" contenteditable="true" placeholder="Nhập mật khẩu"></p>
        </div>
        <div class="login-button">Đăng Nhập</div>

        <div class="social-login">
            <div class="social-button google">
                <img src="https://cdn4.iconfinder.com/data/icons/logos-brands-7/512/google_logo-google_icongoogle-512.png" alt="Google">
                Đăng nhập với Google
            </div>
            <div class="social-button facebook">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" alt="Facebook">
                Đăng nhập với Facebook
            </div>
        </div>

        <div class="additional-links">
            <p>Quên mật khẩu?</p>
            <div class="divider"></div>
            <p class="create-account">Tạo tài khoản mới</p>
        </div>
    </div>
</body>
</html>
